{% if quick_notes %}<section class="early-notes" aria-label="Early notes"><p class="eyebrow">EARLIER IN THE DAY</p><h2>Quick notes</h2>{% for note in quick_notes %}<article class="early-note"><header><time datetime="{{ note.created_at|date:'c' }}">{{ note.created_at|date:"D, M j, Y, P" }}</time><span>SAVED NOTE</span></header>{{ note.body|linebreaks }}</article>{% endfor %}</section>{% endif %}
