{% if archive_page.has_other_pages %}<nav class="view-tabs" aria-label="Archive pages">{% if archive_page.has_previous %}<a href="?page={{ archive_page.previous_page_number }}&sort={{ filters.sort|urlencode }}&status={{ filters.status|urlencode }}">← PREVIOUS</a>{% endif %}<span>PAGE {{ archive_page.number }} OF {{ archive_page.paginator.num_pages }}</span>{% if archive_page.has_next %}<a href="?page={{ archive_page.next_page_number }}&sort={{ filters.sort|urlencode }}&status={{ filters.status|urlencode }}">NEXT →</a>{% endif %}</nav>{% endif %}
